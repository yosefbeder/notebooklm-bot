[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm-telegram-bot"
version = "0.1.0"
description = "Telegram study sessions powered by NotebookLM MCP"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.31,<4", "mcp>=2.3,<3", "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.31,<1", "aiosqlite>=0.22,<1", "pydantic-settings>=2.12,<3",
  "reportlab>=4.4,<5", "pymupdf>=1.26,<2", "lingua-language-detector>=2.1,<3",
  "filelock>=3.13,<5",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.14,<1", "httpx>=0.28,<1"]
notebook = ["notebooklm-mcp-cli==0.16.1", "fastmcp==4.1.6"]

[project.scripts]
study-bot = "studybot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
